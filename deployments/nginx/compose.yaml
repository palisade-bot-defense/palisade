services:
  certificate:
    image: palisade-nginx-fixture:local
    pull_policy: never
    user: "0:0"
    command: ["-test.run=^TestNginxFixtureCertificateAuthority$", "-test.v"]
    environment:
      PALISADE_NGINX_FIXTURE_ROLE: certificate
    read_only: true
    init: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - fixture_certs:/certs
    healthcheck:
      test: ["CMD", "/nginxdiag", "-test.run=^TestNginxFixtureCertificateProbe$"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    networks:
      palisade_nginx_test:
        ipv4_address: 192.0.2.40

  origin:
    build:
      context: ../..
      dockerfile: deployments/nginx/Dockerfile
    image: palisade-nginx-fixture:local
    pull_policy: never
    command: ["-test.run=^TestNginxFixtureOrigin$", "-test.v"]
    environment:
      PALISADE_NGINX_FIXTURE_ROLE: origin
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/nginxdiag", "-test.run=^TestNginxFixtureHealthProbe$"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    networks:
      palisade_nginx_test:
        ipv4_address: 192.0.2.20

  nginx:
    image: nginx@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    pull_policy: never
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0750,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - fixture_certs:/certs:ro
    depends_on:
      certificate:
        condition: service_healthy
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/__proxy_health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    networks:
      palisade_nginx_test:
        ipv4_address: 192.0.2.10

  verifier:
    image: palisade-nginx-fixture:local
    pull_policy: never
    command: ["-test.run=^TestNginxFixtureVerifier$", "-test.v"]
    environment:
      PALISADE_NGINX_FIXTURE_ROLE: verifier
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - fixture_certs:/certs:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      palisade_nginx_test:
        ipv4_address: 192.0.2.30

volumes:
  fixture_certs:

networks:
  palisade_nginx_test:
    internal: true
    ipam:
      config:
        - subnet: 192.0.2.0/24

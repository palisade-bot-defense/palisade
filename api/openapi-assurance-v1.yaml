openapi: 3.1.0

info:
  title: PALISADE assurance API
  version: 1.0.0
  description: |
    The proof-of-human surface. It is a separate contract from the PALISADE HTTP
    API so that api/openapi.yaml, its protobuf contract and every existing
    adapter stay byte-identical, and so a deployment that wants no assurance
    carries no new data class. See docs/adr/0005-assurance-api-surface.md.

    A relying service learns how much verified human evidence backed one
    interaction. It does not learn who the visitor is: an assertion carries no
    subject identity, biometric material, device identifier or cross-site
    identifier, and its session commitment is derived per audience so two
    relying services cannot link the same visitor.

    The specified assurance ladder reaches level 5. This implementation refuses
    to sign or accept anything above level 1. Interactive liveness is
    implemented and a completed attempt is recorded in the assertion, but the
    level it earns is withheld until a confirmed-human false-positive and
    abandonment interval exists per level: gating a surface on an unmeasured
    level would harm people before anyone knows how often it does. Device
    attestation, issuer credentials and uniqueness have no verifier at all.

paths:
  /v1/assurance:
    post:
      summary: Mint a signed human assurance assertion for one relying service
      description: |
        Evaluates the same normalized request the risk surface would and returns
        only the assertion. Scores, evidence, enforcement actions and the
        decision identifier are deliberately not reflected: a relying service
        asking about human presence has no need for the risk decision.

        The response is a complete assertion document. Absence of human evidence
        is a signed level 0, not an error: "presence could not be established"
        is a real answer and must be distinguishable from a failed request.
      operationId: mintAssuranceAssertion
      parameters:
        - in: header
          name: X-Palisade-Assurance-Audience
          required: true
          description: |
            The relying-party scope this assertion is minted for. It must appear
            in the deployment's configured allow list; an unlisted audience is
            refused rather than minted, so a misconfiguration cannot produce
            assertions for an attacker-chosen scope. The audience also salts the
            session commitment.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z0-9][a-z0-9._:-]*$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "openapi.yaml#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: A signed assertion bound to this audience, session, action and endpoint class.
          content:
            application/json:
              schema:
                $ref: "../schemas/human-assurance-assertion-v2.schema.json"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "501":
          description: |
            The deployment does not offer assurance. The surface is disabled
            unless a signing key, a binding secret and at least one allowed
            audience are all configured, so an incomplete configuration fails
            closed instead of minting unusable assertions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/assurance/content:
    post:
      summary: Mint a content-profile assertion for one message
      description: |
        The message surface. The sender computes a SHA-256 over the message it
        is about to send and submits only that commitment alongside the same
        normalized request the risk surface evaluates. PALISADE never receives
        the message. The returned assertion is bound to the commitment and to
        the recipient scope named in the audience header, and stays verifiable
        for the deployment's configured content validity — a day by default, a
        week at most — because a message is read later than it is sent.

        The recipient verifies the assertion with a client-side verifier and
        checks the commitment against the message it received. A forwarded
        assertion fails on the forwarded message; an altered message fails on
        the original assertion. issued_at is the evidence age at the moment of
        sending and must be shown to the recipient separately from validity.
      operationId: mintContentAssertion
      parameters:
        - in: header
          name: X-Palisade-Assurance-Audience
          required: true
          description: The recipient scope this assertion is minted for.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z0-9][a-z0-9._:-]*$"
        - in: header
          name: X-Palisade-Liveness-Attestation
          required: false
          description: A completed interactive liveness attestation for this session, action and endpoint class.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-Palisade-Device-Attestation
          required: false
          description: A completed device ceremony for this session, action and endpoint class.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "openapi.yaml#/components/schemas/DecisionRequest"
                - type: object
                  required: [content_commitment]
                  properties:
                    content_commitment:
                      type: string
                      minLength: 43
                      maxLength: 43
                      pattern: "^[A-Za-z0-9_-]{43}$"
                      description: base64url SHA-256 of the message, computed by the sender.
      responses:
        "200":
          description: A signed content-profile assertion bound to the commitment and the recipient scope.
          content:
            application/json:
              schema:
                $ref: "../schemas/human-assurance-assertion-v2.schema.json"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/assurance/channel:
    post:
      summary: Mint a channel-profile assertion for the current interval of a call
      description: |
        The call surface. Presence is re-established rather than assumed: the
        assertion lives two minutes at most, and a client requests a new one
        every interval for as long as the call lasts. The deployment derives
        the interval from its own clock; a client cannot name one. The other
        participant's client verifies each assertion for its own audience and
        checks that it continues the channel the call started on — the same
        opaque channel commitment, at an interval that advanced.

        Liveness is carried as on every surface: an attestation earned within
        the last two minutes counts, after which the person completes a
        challenge again or the assertion falls back to interaction evidence
        alone. No media is analysed. A verified channel means a present person
        stayed attached; it does not mean the voice is real, and a client must
        not phrase it as if it did.
      operationId: mintChannelAssertion
      parameters:
        - in: header
          name: X-Palisade-Assurance-Audience
          required: true
          description: The other participant's scope this assertion is minted for.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z0-9][a-z0-9._:-]*$"
        - in: header
          name: X-Palisade-Liveness-Attestation
          required: false
          description: A completed interactive liveness attestation for this session, action and endpoint class.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-Palisade-Device-Attestation
          required: false
          description: A completed device ceremony for this session, action and endpoint class.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "openapi.yaml#/components/schemas/DecisionRequest"
                - type: object
                  required: [channel_id]
                  properties:
                    channel_id:
                      type: string
                      minLength: 8
                      maxLength: 128
                      description: The opaque call reference both participants share. It never appears in the assertion; the assertion carries a per-audience commitment derived from it.
      responses:
        "200":
          description: A signed channel-profile assertion for the current interval.
          content:
            application/json:
              schema:
                $ref: "../schemas/human-assurance-assertion-v2.schema.json"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/assurance/device/challenge:
    post:
      summary: Issue a device challenge bound to one session, action and endpoint class
      description: |
        The challenge is what makes a later assertion fresh: without it a
        signature proves only that a key exists somewhere, not that it was used
        here and now. It is answerable once, expires in two minutes, and is
        consumed whatever the outcome, so a client cannot retry against it to
        search for a credential that happens to verify.

        PALISADE registers no credential. The deployment's own registration
        ceremony writes them, and PALISADE reads them through a registry the
        deployment implements, which is where any attestation-statement policy
        was already applied.
      operationId: issueDeviceChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, action, endpoint_class]
              properties:
                session_id: { type: string, minLength: 8, maxLength: 128 }
                action:
                  type: string
                  enum: [read, write, create, update, delete, search, compare, login, logout, register, checkout, purchase, other]
                endpoint_class:
                  type: string
                  enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
      responses:
        "200":
          description: The challenge and the relying-party scope to run the ceremony under.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge_id, challenge, relying_party_id, expires_at]
                properties:
                  challenge_id: { type: string, minLength: 1, maxLength: 64 }
                  challenge:
                    type: string
                    minLength: 43
                    maxLength: 43
                    pattern: "^[A-Za-z0-9_-]{43}$"
                    description: base64url, the encoding a WebAuthn client finds in clientDataJSON after the ceremony.
                  relying_party_id: { type: string, minLength: 1, maxLength: 253 }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/assurance/device/complete:
    post:
      summary: Answer a device challenge with a registered credential
      description: |
        Verifies a WebAuthn authentication assertion against the issued
        challenge, the deployment's relying party and origin, with user
        presence signalled and a signature counter that advanced. A completed
        ceremony returns an attestation to present in
        X-Palisade-Device-Attestation on any assurance surface.

        Every failure returns one status and one code. Saying whether the
        credential was unknown, the signature wrong, the authenticator
        untouched or the counter stale would tell an attacker which constraint
        to work on, and would reveal whether a credential identifier is
        registered here.

        A verified credential is possession of hardware, not presence of a
        person. It never substitutes for interaction evidence and never
        raises a level on its own.
      operationId: completeDeviceCeremony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, session_id, credential_id, authenticator_data, client_data_json, signature]
              properties:
                challenge_id: { type: string, minLength: 1, maxLength: 64 }
                session_id: { type: string, minLength: 8, maxLength: 128 }
                credential_id: { type: string, minLength: 1, maxLength: 256 }
                authenticator_data: { type: string, minLength: 1, maxLength: 16384, pattern: "^[A-Za-z0-9_-]+$" }
                client_data_json: { type: string, minLength: 1, maxLength: 16384, pattern: "^[A-Za-z0-9_-]+$" }
                signature: { type: string, minLength: 1, maxLength: 16384, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: The ceremony completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attestation]
                properties:
                  attestation: { type: string, minLength: 1, maxLength: 128 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The ceremony failed. No further detail is given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /v1/assurance/liveness:
    post:
      summary: Open an interactive liveness attempt
      description: |
        Returns the first round. Later rounds are not disclosed: each prompt is
        revealed only when the previous one is answered, so an attempt cannot be
        solved ahead of time. The correct option is never sent to the client.

        Completing an attempt evidences that the client stayed attached across
        several rounds and answered each inside a narrow window, in order. It
        does not establish that the client is human: each prompt names the
        option to select, so a script that reads the prompt answers as well as a
        person does. This is a live-attachment and throughput argument, not a
        humanity proof.
      operationId: beginLiveness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, action, endpoint_class]
              properties:
                session_id: { type: string, minLength: 8, maxLength: 128 }
                action:
                  type: string
                  enum: [read, write, create, update, delete, search, compare, login, logout, register, checkout, purchase, other]
                endpoint_class:
                  type: string
                  enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
      responses:
        "200":
          description: The attempt and its first round.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessPrompt"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/assurance/liveness/answer:
    post:
      summary: Answer one round of an interactive liveness attempt
      description: |
        Any failure ends the attempt and reports only that it ended. A wrong
        answer, an answer faster than the human reaction floor and a late answer
        are not distinguished: telling a client which constraint it missed tells
        an attacker which one to tune. Retrying inside one attempt is not
        possible, so a client cannot search the option space.
      operationId: answerLiveness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, session_id, round, answer]
              properties:
                challenge_id: { type: string, minLength: 1, maxLength: 64 }
                session_id: { type: string, minLength: 8, maxLength: 128 }
                round: { type: integer, minimum: 0, maximum: 7 }
                answer: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The next round, or the completed attempt and its attestation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [completed]
                properties:
                  completed: { type: boolean }
                  next: { $ref: "#/components/schemas/Prompt" }
                  attestation:
                    type: string
                    description: |
                      Present exactly once, on completion. Present it to
                      /v1/assurance in X-Palisade-Liveness-Attestation. It is
                      bound to the session, action and endpoint class it was
                      earned on and expires in two minutes.
                    minLength: 1
                    maxLength: 128
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The attempt ended. No further rounds are accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Stable machine-readable error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [
              invalid_audience,
              invalid_request,
              invalid_json,
              invalid_session,
              assurance_not_enabled,
              assurance_unavailable,
              liveness_not_enabled,
              liveness_capacity,
              liveness_attempt_ended,
              device_attestation_not_enabled,
              device_challenge_capacity,
              device_ceremony_failed,
            ]
    Prompt:
      type: object
      additionalProperties: false
      required: [round, options, instruction, deadline_at]
      description: |
        One round. The instruction names the option to select, and is what makes
        the round answerable at all. Withholding it would not disadvantage a
        script — a script guesses no better than a person — it would only make
        the round unanswerable, so the mechanism rests on each round being
        revealed at its own moment and answered inside a narrow window, not on
        secrecy. Options are short words so a screen reader can announce them
        and a keyboard can select them; nothing here requires sight or a
        pointer. The word list is English only and a deployment serving other
        languages needs its own.
      properties:
        round: { type: integer, minimum: 0, maximum: 7 }
        options:
          type: array
          minItems: 2
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        instruction:
          type: string
          minLength: 1
          maxLength: 128
          description: The sentence a client shows or announces. It names one of the options.
        deadline_at: { type: string, format: date-time }
    LivenessPrompt:
      type: object
      additionalProperties: false
      required: [challenge_id, family, prompt]
      properties:
        challenge_id: { type: string, minLength: 1, maxLength: 64 }
        family: { type: string, const: interactive_liveness_v1 }
        prompt: { $ref: "#/components/schemas/Prompt" }

openapi: 3.1.0

info:
  title: PALISADE assurance API
  version: 1.0.0
  description: |
    The proof-of-human surface. It is a separate contract from the PALISADE HTTP
    API so that api/openapi.yaml, its protobuf contract and every existing
    adapter stay byte-identical, and so a deployment that wants no assurance
    carries no new data class. See docs/adr/0005-assurance-api-surface.md.

    A relying service learns how much verified human evidence backed one
    interaction. It does not learn who the visitor is: an assertion carries no
    subject identity, biometric material, device identifier or cross-site
    identifier, and its session commitment is derived per audience so two
    relying services cannot link the same visitor.

    The specified assurance ladder reaches level 5. This implementation refuses
    to sign or accept anything above level 1, because nothing here verifies
    interactive liveness, device attestation, issuer credentials or uniqueness.

paths:
  /v1/assurance:
    post:
      summary: Mint a signed human assurance assertion for one relying service
      description: |
        Evaluates the same normalized request the risk surface would and returns
        only the assertion. Scores, evidence, enforcement actions and the
        decision identifier are deliberately not reflected: a relying service
        asking about human presence has no need for the risk decision.

        The response is a complete assertion document. Absence of human evidence
        is a signed level 0, not an error: "presence could not be established"
        is a real answer and must be distinguishable from a failed request.
      operationId: mintAssuranceAssertion
      parameters:
        - in: header
          name: X-Palisade-Assurance-Audience
          required: true
          description: |
            The relying-party scope this assertion is minted for. It must appear
            in the deployment's configured allow list; an unlisted audience is
            refused rather than minted, so a misconfiguration cannot produce
            assertions for an attacker-chosen scope. The audience also salts the
            session commitment.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z0-9][a-z0-9._:-]*$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "openapi.yaml#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: A signed assertion bound to this audience, session, action and endpoint class.
          content:
            application/json:
              schema:
                $ref: "../schemas/human-assurance-assertion-v1.schema.json"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "501":
          description: |
            The deployment does not offer assurance. The surface is disabled
            unless a signing key, a binding secret and at least one allowed
            audience are all configured, so an incomplete configuration fails
            closed instead of minting unusable assertions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Stable machine-readable error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_audience, invalid_request, invalid_json, assurance_not_enabled, assurance_unavailable]

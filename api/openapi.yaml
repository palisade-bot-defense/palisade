openapi: 3.1.0
info:
  title: PALISADE HTTP API
  version: 0.1.0
  description: Early behavior-first decision API. The runtime defaults to shadow mode; production decision and event calls use short-lived, session/action-bound proofs.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: /
paths:
  /health/live:
    get:
      summary: Check process liveness
      operationId: live
      security: []
      responses:
        "200":
          description: Process is live.
  /health/ready:
    get:
      summary: Check service readiness
      operationId: ready
      security: []
      responses:
        "200":
          description: Process is ready.
  /v1/admin/summary:
    get:
      summary: Read privacy-limited operator aggregates
      description: Available only on the separate loopback administrative listener. The public decision listener does not register this route.
      operationId: adminSummary
      security:
        - adminBearer: []
      responses:
        "200":
          description: Process-local counters and an optional validated aggregate shadow-analysis report. No row-level records or identifiers are included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/session:
    post:
      summary: Issue a server-bound continuity cookie
      description: Backend-only endpoint. The integrating origin forwards the Set-Cookie header to the browser; cookie integrity establishes continuity, not humanity or account identity.
      operationId: issueSession
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Signed session cookie issued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/token:
    post:
      summary: Issue a short-lived one-time proof
      description: Backend-only issuance. When proof-classified event shadow evaluation is enabled, an events proof may additionally bind one closed request action and endpoint class. Those fields are signed claims supplied by the trusted backend, never browser observations.
      operationId: issueProof
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              dependentRequired:
                request_action: [endpoint_class]
                endpoint_class: [request_action]
              properties:
                session_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Optional when a valid PALISADE session cookie is supplied; if both are present they must match.
                action: { type: string, minLength: 1, maxLength: 80 }
                request_action:
                  type: string
                  enum: [read, write, create, update, delete, search, compare, login, logout, register, checkout, purchase, other]
                  description: Allowed only when action is events and --event-shadow-from-proof is enabled. The trusted backend derives this class from its route table.
                endpoint_class:
                  type: string
                  enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
                  description: Allowed only when action is events and --event-shadow-from-proof is enabled. Never place a path, URL, query or referer here.
                ttl_seconds: { type: integer, minimum: 1, maximum: 300, default: 60 }
      responses:
        "201":
          description: One-time proof issued.
          content:
            application/json:
              schema:
                type: object
                required: [proof_token, expires_in]
                properties:
                  proof_token: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
  /v1/events:
    post:
      summary: Ingest privacy-limited browser events
      operationId: ingestEvents
      security:
        - eventProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBatch" }
      responses:
        "202":
          description: Accepted. When event-triggered shadow evaluation is configured, the batch remains accepted even if its separate encrypted decision record is dropped.
          headers:
            X-Palisade-Shadow-Evaluation:
              description: Present only when event-triggered shadow evaluation is configured. Reports whether the accepted batch also queued a closed encrypted shadow decision.
              schema: { type: string, enum: [recorded, dropped] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/decision:
    post:
      summary: Produce an explainable computed and enforced action decision
      operationId: decide
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "200":
          description: Decision with scores and evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/origin-check:
    post:
      summary: Evaluate and return the bounded origin enforcement result
      description: Alternative to /v1/decision for an origin or reverse-proxy subrequest. Production requires the one-time proof_token in the request body; signed rollouts additionally require the session cookie. A valid signed rollout may return 429 for throttle or 403 for challenge/block. Shadow and excluded canary requests return 204. Scores and evidence are not reflected in this response.
      operationId: checkOrigin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "204":
          description: Pass the request. This includes shadow mode and requests excluded from a canary.
          headers:
            X-Palisade-Decision-ID: { schema: { type: string } }
            X-Palisade-Action: { schema: { type: string, enum: [allow, observe] } }
            X-Palisade-Handling: { schema: { type: string, enum: [pass] } }
            X-Palisade-Mode: { schema: { type: string, enum: [shadow, canary, enforce] } }
            X-Palisade-Rollout-ID: { schema: { type: string } }
        "403":
          description: Apply the challenge or temporary block selected by a valid signed rollout.
          headers:
            X-Palisade-Decision-ID: { schema: { type: string } }
            X-Palisade-Action: { schema: { type: string, enum: [challenge, block] } }
            X-Palisade-Handling: { schema: { type: string, enum: [challenge, block] } }
            X-Palisade-Mode: { schema: { type: string, enum: [canary, enforce] } }
            X-Palisade-Rollout-ID: { schema: { type: string } }
            X-Palisade-Challenge-ID:
              description: Present only for challenge handling. Retrieve the bound challenge at the Location route.
              schema: { type: string, minLength: 32, maxLength: 32 }
            Location:
              description: Present only for challenge handling.
              schema: { type: string, pattern: "^/v1/challenge/[A-Za-z0-9_-]{32}$" }
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 3600 } }
        "429":
          description: Apply a one-second delay response or a bounded throttle selected by a valid signed rollout. PALISADE returns immediately and never sleeps in the hot path.
          headers:
            X-Palisade-Decision-ID: { schema: { type: string } }
            X-Palisade-Action: { schema: { type: string, enum: [delay, throttle] } }
            X-Palisade-Handling: { schema: { type: string, enum: [delay, throttle] } }
            X-Palisade-Mode: { schema: { type: string, enum: [canary, enforce] } }
            X-Palisade-Rollout-ID: { schema: { type: string } }
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/origin-coverage:
    post:
      summary: Report cumulative completed-request coverage from a trusted origin adapter
      description: Backend-authenticated, process-local measurement contract. Each random source epoch reports only cumulative counts for the nine closed endpoint classes. Reports contain no URL, path, method, header, client address, account identifier or request row. PALISADE rejects source replays, sequence conflicts, decreasing counters and unbalanced dispositions. This measures only requests routed through the configured protected handler, never all website traffic.
      operationId: reportOriginCoverage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OriginCoverageReport" }
      responses:
        "202": { description: Coverage snapshot accepted or idempotently replayed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/challenge/{challenge_id}:
    get:
      summary: Retrieve a session-bound accessible challenge
      description: Returns a nonvisual timed-confirmation contract. It is an anti-replay step-up and does not establish that the client is human.
      operationId: getChallenge
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Challenge metadata bound to the signed session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeMetadata" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/challenge/verify:
    post:
      summary: Verify the active challenge and issue a short-lived redemption capability
      operationId: verifyChallenge
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeVerifyRequest" }
      responses:
        "200":
          description: One-time redemption capability issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeVerification" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "425":
          description: Challenge delay has not elapsed.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 30 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/challenge/redeem:
    post:
      summary: Consume a challenge capability for its exact action and endpoint class
      description: Successful redemption is exactly once and authorizes only the integrating origin's bound request flow; it is recorded as challenge_passed, never human_confirmed.
      operationId: redeemChallenge
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeRedeemRequest" }
      responses:
        "204":
          description: Capability consumed.
          headers:
            X-Palisade-Challenge: { schema: { type: string, enum: [redeemed] } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/challenge/fallback:
    post:
      summary: Close a challenge and request the deployment's accessible fallback
      description: PALISADE records only fallback_used; the integrating origin owns the support, reauthentication or WebAuthn route and must not include a raw return URL here.
      operationId: useChallengeFallback
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeFallbackRequest" }
      responses:
        "204": { description: Fallback choice recorded and challenge closed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/outcome:
    post:
      summary: Attach a normalized delayed outcome to a shadow session
      description: Backend-only. Outcomes are closed labels and are written only when the encrypted local shadow sink is configured.
      operationId: recordOutcome
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeRequest" }
      responses:
        "202": { description: Outcome accepted by the local shadow sink. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminBearer:
      type: http
      scheme: bearer
      description: Distinct PALISADE_ADMIN_KEY accepted only by the loopback administrative listener.
    eventProof:
      type: apiKey
      in: header
      name: X-Palisade-Proof
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-palisade_session
  responses:
    Error:
      description: Stable machine-readable error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    ActionCounts:
      type: object
      additionalProperties: false
      required: [allow, observe, delay, throttle, challenge, block]
      properties:
        allow: { type: integer, minimum: 0 }
        observe: { type: integer, minimum: 0 }
        delay: { type: integer, minimum: 0 }
        throttle: { type: integer, minimum: 0 }
        challenge: { type: integer, minimum: 0 }
        block: { type: integer, minimum: 0 }
    AdminSummary:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, uptime_seconds, runtime, capabilities, traffic, recording, collection, origin_coverage, outcome_flow, transport_posture, crawler_identity, analysis_status, analysis]
      properties:
        schema_version: { type: string, const: palisade.admin-summary.v9 }
        generated_at: { type: string, format: date-time }
        uptime_seconds: { type: integer, minimum: 0 }
        runtime:
          type: object
          additionalProperties: false
          required: [mode, policy_version, model_version]
          properties:
            mode: { type: string, enum: [shadow, canary, enforce] }
            rollout_id: { type: string }
            policy_version: { type: string }
            model_version: { type: string }
        capabilities:
          type: object
          additionalProperties: false
          required: [shadow_log, event_shadow, event_shadow_proof_contexts, analysis_report]
          properties:
            shadow_log: { type: boolean }
            event_shadow: { type: boolean }
            event_shadow_proof_contexts: { type: boolean }
            analysis_report: { type: boolean }
        traffic:
          type: object
          additionalProperties: false
          required: [accepted_event_batches, accepted_events, decisions, origin_checks, enforced, computed, reasons]
          properties:
            accepted_event_batches: { type: integer, minimum: 0 }
            accepted_events: { type: integer, minimum: 0 }
            decisions: { type: integer, minimum: 0 }
            origin_checks: { type: integer, minimum: 0 }
            enforced: { $ref: "#/components/schemas/ActionCounts" }
            computed: { $ref: "#/components/schemas/ActionCounts" }
            reasons:
              type: array
              maxItems: 64
              items:
                type: object
                additionalProperties: false
                required: [code, count]
                properties:
                  code: { type: string, pattern: "^[A-Z0-9_]{3,64}$" }
                  count: { type: integer, minimum: 0 }
        recording:
          type: object
          additionalProperties: false
          required: [decisions, outcomes, dropped, event_shadow_dropped]
          properties:
            decisions: { type: integer, minimum: 0 }
            outcomes: { type: integer, minimum: 0 }
            dropped: { type: integer, minimum: 0 }
            event_shadow_dropped: { type: integer, minimum: 0 }
        collection:
          type: object
          description: Process-local PALISADE collection funnel only. It never claims a share of total site traffic because an authenticated external request denominator is not part of this contract.
          additionalProperties: false
          required: [state, traffic_denominator, context_proofs_issued, accepted_event_batches, recorded_shadow_decisions, rejected_before_ingest, dropped_after_ingest, batch_recording_rate, endpoint_context_proofs]
          properties:
            state: { type: string, enum: [disabled, no_samples, collecting, degraded] }
            traffic_denominator: { type: string, const: external_total_unavailable }
            context_proofs_issued: { type: integer, minimum: 0 }
            accepted_event_batches: { type: integer, minimum: 0 }
            recorded_shadow_decisions: { type: integer, minimum: 0 }
            rejected_before_ingest: { type: integer, minimum: 0 }
            dropped_after_ingest: { type: integer, minimum: 0 }
            batch_recording_rate: { type: number, minimum: 0, maximum: 1 }
            endpoint_context_proofs:
              type: array
              maxItems: 9
              items:
                type: object
                additionalProperties: false
                required: [endpoint_class, count]
                properties:
                  endpoint_class:
                    type: string
                    enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
                  count: { type: integer, minimum: 1 }
        origin_coverage:
          type: object
          description: Authenticated cumulative counts for completed requests routed through configured PALISADE reference middleware instances. This is protected-handler coverage, not a claim about total website traffic.
          additionalProperties: false
          required: [state, scope, traffic_denominator, sources, observed_since, last_reported_at, protected_requests, evaluated_requests, bypassed_requests, rejected_requests, granted_retries, decision_coverage_rate, endpoints]
          properties:
            state: { type: string, enum: [unavailable, no_samples, collecting, degraded] }
            scope: { type: string, const: protected_handler_requests }
            traffic_denominator: { type: string, const: authenticated_origin_reports }
            sources: { type: integer, minimum: 0, maximum: 1024 }
            observed_since: { type: [string, "null"], format: date-time }
            last_reported_at: { type: [string, "null"], format: date-time }
            protected_requests: { type: integer, minimum: 0 }
            evaluated_requests: { type: integer, minimum: 0 }
            bypassed_requests: { type: integer, minimum: 0 }
            rejected_requests: { type: integer, minimum: 0 }
            granted_retries: { type: integer, minimum: 0 }
            decision_coverage_rate: { type: number, minimum: 0, maximum: 1 }
            endpoints:
              type: array
              maxItems: 9
              items: { $ref: "#/components/schemas/OriginCoverageCounter" }
        outcome_flow:
          type: object
          description: Process-local outcome event ingestion health. Accepted events are not necessarily ground-truth labels and the counts are never converted into a false-positive metric here.
          additionalProperties: false
          required: [state, accepted, rejected, dropped]
          properties:
            state: { type: string, enum: [disabled, no_samples, collecting, degraded] }
            accepted: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            dropped: { type: integer, minimum: 0 }
        transport_posture:
          type: object
          description: Process-local closed transport-normalization counts from successfully evaluated decisions. No peer, proxy or client address and no header value is retained. Attention means the trust boundary needs operator review, not that an attack was proven.
          additionalProperties: false
          required: [state, scope, samples, protocol, security, address_source]
          properties:
            state: { type: string, enum: [no_samples, collecting, attention] }
            scope: { type: string, const: evaluated_decisions }
            samples: { type: integer, minimum: 0 }
            protocol:
              type: object
              additionalProperties: false
              required: [http1, http2, http3, unknown]
              properties:
                http1: { type: integer, minimum: 0 }
                http2: { type: integer, minimum: 0 }
                http3: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
            security:
              type: object
              additionalProperties: false
              required: [direct_tls, trusted_proxy_tls, plaintext, unknown]
              properties:
                direct_tls: { type: integer, minimum: 0 }
                trusted_proxy_tls: { type: integer, minimum: 0 }
                plaintext: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
            address_source:
              type: object
              additionalProperties: false
              required: [direct, trusted_proxy, invalid_trusted_proxy, unknown]
              properties:
                direct: { type: integer, minimum: 0 }
                trusted_proxy: { type: integer, minimum: 0 }
                invalid_trusted_proxy: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
        crawler_identity:
          type: object
          description: Process-local aggregate crawler identity observations. Qualified means the closed class, strong proof and public endpoint scope all matched; attention means at least one claim was not eligible, not that an attack was proven. No address, user-agent or vendor name is retained.
          additionalProperties: false
          required: [state, scope, observations, qualified_public, unqualified, classes, verification]
          properties:
            state: { type: string, enum: [no_samples, collecting, attention] }
            scope: { type: string, const: evaluated_identity_observations }
            observations: { type: integer, minimum: 0 }
            qualified_public: { type: integer, minimum: 0 }
            unqualified: { type: integer, minimum: 0 }
            classes:
              type: object
              additionalProperties: false
              required: [search_indexer, answer_engine, training_crawler, user_triggered_agent, preview, monitoring, other, unknown]
              properties:
                search_indexer: { type: integer, minimum: 0 }
                answer_engine: { type: integer, minimum: 0 }
                training_crawler: { type: integer, minimum: 0 }
                user_triggered_agent: { type: integer, minimum: 0 }
                preview: { type: integer, minimum: 0 }
                monitoring: { type: integer, minimum: 0 }
                other: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
            verification:
              type: object
              additionalProperties: false
              required: [ip_ua_registry, fcrdns_ua, http_signature, unknown]
              properties:
                ip_ua_registry: { type: integer, minimum: 0 }
                fcrdns_ua: { type: integer, minimum: 0 }
                http_signature: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
        analysis_status:
          type: object
          additionalProperties: false
          required: [state, loaded_at, last_attempt_at]
          properties:
            state: { type: string, enum: [not_configured, ready, invalid_update] }
            loaded_at: { type: [string, "null"], format: date-time }
            last_attempt_at: { type: [string, "null"], format: date-time }
        analysis:
          description: Validated palisade.shadow-analysis.v3 aggregate report, or null when no report was loaded. It contains linked endpoint/cohort Wilson intervals and aggregate canary comparisons, but no row-level records or decision identifiers.
          oneOf:
            - type: "null"
            - type: object
              required: [schema_version, source, readiness, decisions, outcomes, scores, endpoints, top_reason_codes, policy_versions, model_versions, canary_rollouts, canary_comparisons, linkage, evaluation_slices, recommendations]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    ChallengeMetadata:
      type: object
      additionalProperties: false
      required: [challenge_id, family, ready_at, expires_at, attempts_remaining, verification_token, accessibility]
      properties:
        challenge_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
        family: { type: string, enum: [timed_confirmation_v1] }
        ready_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        attempts_remaining: { type: integer, minimum: 0, maximum: 20 }
        verification_token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
        accessibility:
          type: object
          additionalProperties: false
          required: [non_visual, keyboard_only, fallback_offered]
          properties:
            non_visual: { type: boolean, const: true }
            keyboard_only: { type: boolean, const: true }
            fallback_offered: { type: boolean, const: true }
    ChallengeVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, verification_token]
      properties:
        challenge_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
        verification_token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
    ChallengeVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, redemption_token, expires_at]
      properties:
        challenge_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
        redemption_token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
        expires_at: { type: string, format: date-time }
    ChallengeRedeemRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, redemption_token, action, endpoint_class]
      properties:
        challenge_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
        redemption_token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
        action: { type: string, minLength: 1, maxLength: 80 }
        endpoint_class:
          type: string
          enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
    ChallengeFallbackRequest:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, expires_at]
      properties:
        session_id: { type: string, minLength: 32, maxLength: 32 }
        expires_at: { type: string, format: date-time }
    OutcomeRequest:
      type: object
      description: Closed backend outcome label linked to the exact decision. The server validates that provenance and confidence are compatible with the selected outcome; challenge completion is never human confirmation.
      additionalProperties: false
      required: [decision_id, endpoint_class, outcome, provenance, confidence]
      properties:
        session_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: Optional when a valid PALISADE session cookie is supplied; the server derives and binds the session from that cookie.
        decision_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
        endpoint_class:
          type: string
          enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
        outcome:
          type: string
          enum: [successful_action, challenge_passed, challenge_failed, challenge_abandoned, human_confirmed, operator_confirmed_abuse, appeal_requested, fallback_used, unknown]
        provenance:
          type: string
          enum: [authenticated_account, operator_review, server_observed, user_feedback, unknown]
        confidence:
          type: string
          enum: [confirmed, unknown]
    OriginCoverageReport:
      type: object
      additionalProperties: false
      required: [schema_version, source_id, source_started_at, sequence, completed_at, endpoints]
      properties:
        schema_version: { type: string, const: palisade.origin-coverage.v1 }
        source_id: { type: string, minLength: 32, maxLength: 32, pattern: "^[a-f0-9]{32}$", description: Random per-process epoch; not a deployment, account or device identifier. }
        source_started_at: { type: string, format: date-time, description: UTC whole-second timestamp for the first completion counted by this source epoch. }
        sequence: { type: integer, minimum: 1 }
        completed_at: { type: string, format: date-time }
        endpoints:
          type: array
          description: Exactly the nine canonical endpoint classes in the documented enum order; duplicates or reordering are rejected.
          minItems: 9
          maxItems: 9
          items: { $ref: "#/components/schemas/OriginCoverageCounter" }
    OriginCoverageCounter:
      type: object
      additionalProperties: false
      required: [endpoint_class, protected_requests, evaluated_requests, bypassed_requests, rejected_requests, granted_retries]
      properties:
        endpoint_class:
          type: string
          enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
        protected_requests: { type: integer, minimum: 0, maximum: 1000000000000000 }
        evaluated_requests: { type: integer, minimum: 0, maximum: 1000000000000000 }
        bypassed_requests: { type: integer, minimum: 0, maximum: 1000000000000000 }
        rejected_requests: { type: integer, minimum: 0, maximum: 1000000000000000 }
        granted_retries: { type: integer, minimum: 0, maximum: 1000000000000000 }
    BrowserEvent:
      type: object
      additionalProperties: false
      required: [sequence, elapsedBucketMs, kind, valueBucket]
      properties:
        sequence: { type: integer, minimum: 1 }
        elapsedBucketMs: { type: integer, minimum: 0, maximum: 86400000 }
        kind:
          type: string
          enum: [pointer, scroll, visibility, navigation, performance]
        valueBucket: { type: integer, minimum: 0, maximum: 65536 }
    EventBatch:
      type: object
      additionalProperties: false
      required: [sensorVersion, events]
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
          description: Optional when a valid PALISADE session cookie is supplied; if both are present they must match.
        sensorVersion: { type: string, maxLength: 32 }
        events:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/BrowserEvent" }
    Observations:
      type: object
      additionalProperties: false
      properties:
        user_agent_present: { type: boolean }
        browser_event_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: Claimed count for compatibility. The live service replaces it with its bounded server-side event-store count before evaluation; an unverified claim never creates benign continuity evidence.
        honeypot_hits: { type: integer, minimum: 0, maximum: 100 }
        challenge_verdict:
          type: string
          enum: [suspicious, failed, blocked, allowed, passed, unknown]
          description: Normalized result from a trusted challenge adapter. A passed challenge is an outcome, not proof that the client is human.
        external_risk_score: { type: number, minimum: 0, maximum: 1 }
        policy_alert:
          type: boolean
          description: Trusted deployment policy alert normalized to a boolean; clients must not set this directly.
        verified_bot:
          type: boolean
          description: Trusted origin claim only. It qualifies for beneficial-crawler handling only with an eligible crawler_class, a strong crawler_verification and a public indexable endpoint class; a user-agent alone never verifies identity.
        crawler_class:
          type: string
          enum: [unknown, search_indexer, answer_engine, training_crawler, user_triggered_agent, preview, monitoring, other]
          description: Closed purpose class from a trusted origin verifier. Training crawlers remain policy-controlled and are never auto-allowed by the default policy.
        crawler_verification:
          type: string
          enum: [unknown, ip_ua_registry, fcrdns_ua, http_signature]
          description: Closed proof method. The reference adapter performs local IP-plus-user-agent registry matching without sending the address or user-agent to PALISADE.
        transport_protocol:
          type: string
          enum: [http1, http2, http3, unknown]
          description: Closed protocol family normalized by the trusted origin adapter; never a raw protocol string.
        transport_security:
          type: string
          enum: [direct_tls, trusted_proxy_tls, plaintext, unknown]
          description: Closed transport-security class. Forwarded TLS metadata is accepted only from a configured trusted TCP peer.
        client_address_source:
          type: string
          enum: [direct, trusted_proxy, invalid_trusted_proxy, unknown]
          description: Provenance class only. PALISADE does not receive the client or proxy address.
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [action, endpoint_class, sequence, observations]
      properties:
        session_id:
          type: string
          minLength: 8
          maxLength: 128
          description: Optional when a valid PALISADE session cookie is supplied; if both are present they must match.
        action: { type: string, minLength: 1, maxLength: 80 }
        endpoint_class:
          type: string
          enum: [public_content, compare_index, compare_noindex, challenge_worker, other_public, account, login, checkout, other]
        sequence: { type: integer, minimum: 1 }
        proof_token: { type: string }
        observations: { $ref: "#/components/schemas/Observations" }
        evaluation_cohort:
          type: string
          enum: [standard, reduced_motion, keyboard_only, fallback_path, sensor_missing, unknown]
          description: Optional trusted, coarse operational cohort used only for aggregate evaluation. PALISADE does not infer identity, disability or demographic attributes; omitted values become unknown.
    Decision:
      type: object
      required: [decision_id, action, computed_action, mode, directive, scores, reason_codes, evidence, policy_version, model_version, expires_at]
      properties:
        decision_id: { type: string }
        action:
          type: string
          enum: [allow, observe, delay, throttle, challenge, block]
          description: Enforced action. In shadow mode this is limited to allow or observe.
        computed_action:
          type: string
          enum: [allow, observe, delay, throttle, challenge, block]
          description: Unmodified result of policy evaluation.
        mode:
          type: string
          enum: [shadow, canary, enforce]
        rollout_id:
          type: string
          pattern: "^[A-Za-z0-9_.:-]{1,128}$"
          description: Signed rollout identifier when a canary or enforcement plan evaluated this decision.
        directive:
          $ref: "#/components/schemas/EnforcementDirective"
        scores:
          type: object
          required: [automation_risk, abuse_intent_risk, account_continuity]
          properties:
            automation_risk: { type: number, minimum: 0, maximum: 1 }
            abuse_intent_risk: { type: number, minimum: 0, maximum: 1 }
            account_continuity: { type: number, minimum: 0, maximum: 1 }
        reason_codes: { type: array, items: { type: string } }
        evidence: { type: array, items: { type: object } }
        policy_version: { type: string }
        model_version: { type: string }
        expires_at: { type: string, format: date-time }
    EnforcementDirective:
      type: object
      additionalProperties: false
      required: [handling, http_status, expires_at]
      description: Machine-readable origin handling. The integrating origin must still apply this directive; PALISADE is not an inline reverse proxy.
      properties:
        handling: { enum: [pass, delay, throttle, challenge, block] }
        http_status: { type: integer, enum: [200, 403, 429] }
        retry_after_seconds: { type: integer, minimum: 1, maximum: 3600 }
        expires_at: { type: string, format: date-time }
